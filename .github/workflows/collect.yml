# Hourly collection into the `data` branch so history builds up beyond the API's ~15 days.
# The bulk file holds ~90 minutes, so hourly polling loses nothing.
# Note: GitHub runs scheduled workflows on a best-effort basis and pauses them after
# 60 days without repository activity.
name: collect

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install duckdb pandas numpy pyyaml requests
      - name: Check out data branch
        run: |
          git fetch origin data || true
          if git show-ref --quiet refs/remotes/origin/data; then
            git worktree add history origin/data
            git -C history checkout -B data
          else
            git worktree add --detach history
            git -C history checkout --orphan data
            git -C history rm -rf . > /dev/null
          fi
      - run: python scripts/collect_snapshot.py history/data/history
      - name: Commit
        run: |
          cd history
          git config user.name "turbqc-collector"
          git config user.email "turbqc-collector@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data
