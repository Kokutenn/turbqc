# One or more cases per rule. Each case starts from a valid baseline AIREP track
# (tests/conftest.py: base_track) and applies `set` overrides to the row at `row`.
# `fails` lists the rows expected to fail the rule; [] means the case must pass.
# test_rules.py also asserts that every rule in config/rules.yaml has at least one
# failing case and that the untouched baseline passes every rule.
cases:
  - {rule: R001, name: missing receipt time, row: 2, set: {receipt_time: null}, fails: [2]}
  - {rule: R002, name: missing observation time, row: 2, set: {obs_time: null}, fails: [2]}
  - {rule: R003, name: blank aircraft id, row: 2, set: {aircraft_ref: "  "}, fails: [2]}
  - {rule: R004, name: missing latitude, row: 2, set: {lat: null}, fails: [2]}
  - {rule: R005, name: missing altitude, row: 2, set: {alt_ft: null}, fails: [2]}
  - {rule: R006, name: unknown report type, row: 2, set: {report_type: METAR}, fails: [2]}
  - {rule: R007, name: empty raw text, row: 2, set: {raw_text: ""}, fails: [2]}
  - {rule: R010, name: latitude above 90, row: 2, set: {lat: 91.0}, fails: [2]}
  - {rule: R011, name: longitude below -180, row: 2, set: {lon: -181.0}, fails: [2]}
  - {rule: R012, name: altitude above 60000 ft, row: 2, set: {alt_ft: 65000}, fails: [2]}
